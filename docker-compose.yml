version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: irc
      POSTGRES_USER: irc
      POSTGRES_PASSWORD: irc
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2024-01-09T22-46-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: irc-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # Live-streaming media plane. Browsers go live over WebRTC/WHIP (:8889) — they
  # cannot publish RTMP — while OBS/ffmpeg use RTMP (:1935). Viewers watch over WHEP
  # (:8889, low latency) or HLS (:8888). All HTTP surfaces send CORS '*' so the
  # browser can reach them cross-origin. Config (incl. the backend HTTP-auth hook
  # that keeps ingest host-only) lives in ./mediamtx.yml. extra_hosts lets the
  # container reach the app on the host at host.docker.internal for the auth callback.
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      # Recordings land on the host so the backend (running on the host) serves
      # the owner a download straight from disk. Keep this path in sync with
      # app.streaming.recordings-dir (default ./recordings).
      - ./recordings:/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1935:1935"       # RTMP ingest    (OBS/ffmpeg publish, gated by streamKey)
      - "8889:8889"       # WebRTC WHIP/WHEP (browser publish + low-latency playback)
      - "8189:8189/udp"   # WebRTC ICE/media (UDP mux for WHIP/WHEP)
      - "8888:8888"       # HLS playback    (viewers read here)
      - "127.0.0.1:9997:9997"  # Control API — backend enables per-stream recording.
                               # Bound to localhost only: never expose it publicly.

  # ── Automated text moderation (docs/moderation/MODERATION_ROADMAP.md §7) ────
  # Two Python containers behind a private HTTP contract. The backend runs on
  # the HOST here (like every other datastore in this file), so both publish to
  # localhost rather than relying on a shared compose network — set
  # MODERATION_INFERENCE_URL / MODERATION_TRAINING_URL to the container names
  # instead once the app itself is containerized.
  #
  # They share the `model-artifacts` volume: training writes /app/model/<version>/,
  # inference reloads that path when an admin promotes the version. Neither ever
  # touches Postgres — the dataset arrives over HTTP.
  model-inference:
    build: ./docs/model-inference
    environment:
      MODEL_ROOT: /app/model
      # Which artifact to load at boot. Point at a promoted version dir (e.g.
      # /app/model/v3) once one exists; with nothing mounted the service falls
      # back to BASE_CHECKPOINT so a fresh clone still comes up scoring.
      MODEL_PATH: ${MODERATION_MODEL_PATH:-/app/model}
      BASE_CHECKPOINT: ${MODERATION_BASE_CHECKPOINT:-unitary/toxic-bert}
      MAX_LENGTH: "256"
      # Must match app.moderation.inference.api-key in application.yaml.
      INFERENCE_API_KEY: ${MODERATION_INFERENCE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - model-artifacts:/app/model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  # Not started by default — `docker compose --profile on-demand up model-training`.
  # A fine-tune saturates the CPU; it only needs to be up while a retrain runs.
  model-training:
    build: ./docs/model-training
    environment:
      MODEL_ROOT: /app/model
      DATA_ROOT: /app/data
      BASE_CHECKPOINT: ${MODERATION_BASE_CHECKPOINT:-unitary/toxic-bert}
      TRAINING_API_KEY: ${MODERATION_TRAINING_API_KEY:-}
    ports:
      - "8001:8001"
    volumes:
      - model-artifacts:/app/model
      - training-data:/app/data
    extra_hosts:
      # So the training container can POST its completion webhook back to the
      # backend running on the host (app.moderation.training.callback-url).
      - "host.docker.internal:host-gateway"
    profiles: ["on-demand"]

volumes:
  db-data:
  minio-data:
  cassandra-data:
  elasticsearch-data:
  model-artifacts:
  training-data:
