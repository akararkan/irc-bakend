version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: irc
      POSTGRES_USER: irc
      POSTGRES_PASSWORD: irc
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2024-01-09T22-46-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: irc-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # Live-streaming media plane: RTMP in (:1935), HLS out (:8888).
  # Serves HLS with Access-Control-Allow-Origin: * so the browser can read the
  # .m3u8/.ts cross-origin. Config (incl. the backend HTTP-auth hook that keeps
  # ingest host-only) lives in ./mediamtx.yml. extra_hosts lets the container
  # reach the app on the host at host.docker.internal for the auth callback.
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1935:1935"   # RTMP ingest  (host publishes here, gated by streamKey)
      - "8888:8888"   # HLS playback (viewers read here)

volumes:
  db-data:
  minio-data:
  cassandra-data:
  elasticsearch-data:
