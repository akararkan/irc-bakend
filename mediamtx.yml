###############################################
# MediaMTX — media plane for the IRC live-streaming feature.
#
# Two ways to go live, one way (×2) to watch:
#   • WHIP  (WebRTC, :8889)  — the BROWSER camera publishes here ("Go Live" in the
#                              app). This is how TikTok/YouTube/Facebook go live from
#                              the app: browsers CANNOT publish RTMP, only WebRTC.
#   • RTMP  (:1935)          — OBS / ffmpeg / desktop encoders publish here.
#   • WHEP  (WebRTC, :8889)  — viewers watch with sub-second latency (the "live" feel).
#   • HLS   (:8888)          — viewers watch with higher latency but universal reach.
#
# Authorization is delegated to the backend: MediaMTX POSTs every publish/read to the
# app's media-auth hook, which authorizes a *publish* (WHIP or RTMP) only when it
# carries the stream's secret streamKey (?pass=), and allows *reads* (WHEP/HLS) for
# any LIVE stream. See MediaAuthController / LiveStreamService.authorizeMediaAccess.

logLevel: info

# ── Connection tuning ────────────────────────────────────────────────────────
# Size of the per-connection queue of outgoing packets. Raised from MediaMTX's
# default of 512 to reduce packet drops under concurrent high-throughput
# publish/read load (multiple simultaneous WHIP publishers + WHEP/HLS readers
# all sharing this box).
# NOTE: this key was named `readBufferCount` through MediaMTX v1.0.0 and was
# renamed to `writeQueueSize` in v1.1.0+ (same slot in the sample config, same
# default of 512) — `bluenviron/mediamtx:latest` here is pinned to v1.20.1
# (checked via the image digest + GitHub releases), which only recognizes the
# new name. MediaMTX's config loader hard-rejects unknown keys (`json: unknown
# field`), so `readBufferCount: 2048` would have failed to boot the container
# outright rather than being silently ignored.
writeQueueSize: 2048

# ── Ingest / playback protocols ──────────────────────────────────────────────
rtsp: no
rtmp: yes            # RTMP ingest (:1935) — OBS / ffmpeg
srt: no

# WebRTC (:8889) — WHIP publish (browser camera) + WHEP playback (low latency).
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no                 # plain HTTP for local dev; put TLS in front for prod
webrtcAllowOrigins: ["*"]            # browser reads the WHIP/WHEP endpoint cross-origin
# ICE: advertise `localhost` (same-machine browsers) AND the host's LAN IP
# (phones on the Wi-Fi) over one published UDP port, so WebRTC works through
# Docker Desktop's NAT (the container's own 172.x IPs are unreachable from the
# host and would just waste ICE time). The LAN IP MUST track the machine's
# actual address — keep it in sync with EXPO_PUBLIC_API_BASE_URL in the mobile
# app's .env and app.streaming.* in application.yaml, and restart this
# container after editing (`docker compose restart mediamtx`). In production,
# replace it with the server's public IP/hostname and publish 8189/udp on the
# firewall.
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [localhost, 192.168.33.19]
# How long MediaMTX waits, after the peer connection is up, to gather the
# session's track list before freezing it. The DEFAULT 2s loses a race on a COLD
# browser camera: getUserMedia resolves when the device opens, but Chrome's first
# ENCODED H264 frame lands later — miss the window and the session is frozen as
# audio-only, so every viewer AND the recorder get sound with no picture (a black
# download). 10s comfortably covers cold-camera encoder start-up. Verified: at 2s
# a cold camera registers ["Opus"] only; at 10s it registers ["Opus","H264"].
webrtcTrackGatherTimeout: 10s

# HLS (:8888) — fMP4/CMAF so BOTH sources remux cleanly: RTMP (H264+AAC) and WHIP
# (H264+Opus). The old `mpegts` variant cannot carry Opus, so browser-published audio
# would be dropped. hls.js plays fMP4 everywhere; Safari plays it natively. CORS open
# so the browser can read the manifest/segments cross-origin.
hls: yes
hlsVariant: fmp4
# Low-latency HLS tuning for the fallback path (viewers who can't use WHEP).
# NOTE: as of MediaMTX v1.20.1 (the version `latest` currently resolves to)
# these three values are already the compiled-in defaults, so this pins them
# explicitly rather than changing current behavior. More importantly,
# hlsPartDuration only shortens glass-to-glass latency when hlsVariant is
# `lowLatency` (CMAF partial segments) — the docs describe parts as "used in
# Low-Latency HLS in place of segments." Under `fmp4` the key is still valid
# and accepted, but inert: fmp4 emits whole segments only, so hlsPartDuration
# has no observable effect while hlsVariant stays fmp4. hlsVariant is kept as
# fmp4 here per the Opus-compatibility note above — switching to `lowLatency`
# would be the actual latency win, but that's a behavior change beyond this
# pass and wasn't verified here for Opus-over-WHIP compatibility, so it's left
# for a follow-up rather than changed silently.
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsAllowOrigins: ["*"]

# ── Control API ──────────────────────────────────────────────────────────────
# Runtime config API (:9997), used by the backend (MediaControlClient) to enable
# recording PER STREAM. Excluded from the media-auth hook below (authHTTPExclude:
# action: api) so the app can call it without a stream key. Trusted on the network
# — localhost in dev; firewall it (do NOT publish 9997 publicly) in prod.
api: yes
apiAddress: :9997

# ── Recording (per-path opt-in) ──────────────────────────────────────────────
# record: no here means NOTHING is recorded by default — only streams the host
# opted into get a per-path config with record: true (POST /v3/config/paths/add
# from MediaControlClient), so only those ever touch disk (no wasted writes, no
# delete-race orphans, no privacy window). When a path IS recording it uses the
# settings below: fMP4 (.mp4) under /recordings/<path>/ — <path> is the stream id.
# The bind mount (docker-compose.yml) lands files on the host, so the backend
# serves the owner a download straight from disk (RecordingStorageService), no
# media round trip. A long segment window keeps a typical broadcast in a single
# downloadable file; recordDeleteAfter: 0s = never auto-delete (the app owns
# retention — on stream/recording delete). These live under pathDefaults (the
# top-level record* keys are deprecated in MediaMTX ≥1.x); every path — including
# the ones the Control API adds — inherits them unless it overrides record.
pathDefaults:
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 24h
  recordDeleteAfter: 0s

# ── Backend authorization hook ───────────────────────────────────────────────
# Every publish/read decision goes to the backend. The {secret} path segment must
# match app.streaming.auth-secret so only our media server can call the hook.
# `host.docker.internal` = the host running the app.
authMethod: http
authHTTPAddress: http://host.docker.internal:8080/internal/media/auth/dev-media-auth-secret
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# Accept any path name (the stream id). `source: publisher` = the path is fed by
# whoever publishes to it (WHIP or RTMP). Authorization is still enforced globally by
# the HTTP auth hook above, so this catch-all does not weaken access control.
paths:
  all_others:
    source: publisher
