# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — DEVELOPMENT PROFILE
#
#  Loaded by default (see spring.profiles.default in application.yaml).
#  Mirrors the docker-compose.yml services in the repo root — `docker compose
#  up` brings up Postgres / Redis / RabbitMQ / MinIO on the ports below.
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  # ── Database ──────────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/irc}
    username: ${DB_USERNAME:khi}
    password: ${DB_PASSWORD:}

  # ── JPA — dev-friendly: see queries, auto-evolve schema ─────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # ── SQL init (data.sql / schema.sql) runs after Hibernate DDL ───────────────
  sql:
    init:
      mode: always

  # ── Redis ─────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}


# ═══════════════════════════════════════════════════════════════════════════════
#  Dev-only fallback secrets — NOT used in production (prod profile overrides).
#  These let new contributors run `./mvnw spring-boot:run` without setting any
#  env vars. The values are intentionally weak/throwaway.
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  verification:
    secret: ${IRC_VERIFICATION_SECRET:dev-only-32-char-verification-secret-xx}

app:
  jwt:
    # Local dev JWT secret. Override with APP_JWT_SECRET in production.
    secret: ${APP_JWT_SECRET:XyZ9aBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJk=}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.1.118:3000,http://192.168.1.118:5173,http://192.168.1.118:8080}


# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING — verbose for development
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    ak.dev.irc: DEBUG
    ak.dev.irc.security: DEBUG
    org.springframework.security: INFO
