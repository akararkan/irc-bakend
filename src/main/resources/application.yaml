# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — BASE / SHARED CONFIGURATION
#
#  Profile-specific overrides live in:
#    - application-dev.yaml   (local development — default profile)
#    - application-prod.yaml  (production — Railway, etc.)
#
#  Activate a profile with:  SPRING_PROFILES_ACTIVE=prod
#  When no profile is set, "dev" is loaded automatically (see below).
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: irc

  # Default profile when SPRING_PROFILES_ACTIVE is not set — keeps the local
  # workflow identical to before (mvn spring-boot:run just works).
  profiles:
    default: dev

  # ── Database ──────────────────────────────────────────────────────────────────
  # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  # are honoured automatically by Spring Boot's relaxed binding; profile YAML
  # files just fill in sensible defaults.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ───────────────────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
        query:
          in_clause_parameter_padding: true

  # ── Redis ─────────────────────────────────────────────────────────────────────
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
    template:
      mandatory: true

  # ── Jackson ───────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

  # ── Mail (SMTP) ──────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false

  # ── File Upload ───────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}

  # ── MVC ───────────────────────────────────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false


# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM CORE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  doi:
    prefix: ${DOI_PREFIX:10.12345}

  base-url: ${IRC_BASE_URL:https://irc.example.com}

  # Notification email branding + reply-to.
  email:
    from-address: ${MAIL_FROM:${spring.mail.username:no-reply@irc.example.com}}
    from-name: ${MAIL_FROM_NAME:IRC Platform}
    enabled: ${MAIL_ENABLED:true}
    throttle-minutes: ${MAIL_THROTTLE_MINUTES:60}

  verification:
    # Required in production — set IRC_VERIFICATION_SECRET to a 32+ char random string.
    secret: ${IRC_VERIFICATION_SECRET:}


# ═══════════════════════════════════════════════════════════════════════════════
#  APPLICATION SPECIFIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
app:

  jwt:
    # MUST be set via APP_JWT_SECRET env var in production (Base64, ≥256 bits).
    secret: ${APP_JWT_SECRET:}
    # Access token: 24 h. Long enough that the front-end rarely sees a 401,
    # short enough that a leaked token is not an indefinite back-door.
    access-token-expiration-ms:  ${APP_JWT_ACCESS_MS:86400000}
    # Refresh token: 90 days. Combined with rotate-on-refresh below, an active
    # user stays logged in indefinitely (each refresh extends the chain) while
    # a truly idle user only loses their session after 90 days of inactivity.
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_MS:7776000000}
    issuer: ${APP_JWT_ISSUER:irc-platform}

  cors:
    allowed-origins: ${CORS_ORIGINS:}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_HEADERS:*}
    allow-credentials: ${CORS_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  storage:
    endpoint:        ${R2_ENDPOINT:}
    access-key:      ${R2_ACCESS_KEY:}
    secret-key:      ${R2_SECRET_KEY:}
    bucket-name:     ${R2_BUCKET_NAME:irc}
    public-url-base: ${R2_PUBLIC_URL:}
    region:          ${R2_REGION:auto}


# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING (base — profiles tighten or loosen)
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    ak.dev.irc: INFO
    org.springframework.security: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN
    org.hibernate: WARN
    io.netty: ERROR
    io.netty.util.internal: ERROR
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ═══════════════════════════════════════════════════════════════════════════════
#  MANAGEMENT / OBSERVABILITY  (Spring Boot Actuator + Prometheus)
#    GET /actuator/health        — liveness/readiness  (Railway healthcheck)
#    GET /actuator/info          — build info
#    GET /actuator/metrics       — list metric names
#    GET /actuator/prometheus    — scrape format
# ═══════════════════════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true


# ═══════════════════════════════════════════════════════════════════════════════
#  SERVER  — Railway injects PORT; we honour both PORT and SERVER_PORT.
# ═══════════════════════════════════════════════════════════════════════════════
server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework        # honour X-Forwarded-* behind Railway's proxy
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  shutdown: graceful
