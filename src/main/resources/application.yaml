# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — APPLICATION CONFIGURATION (UPDATED WITH CASSANDRA)
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: irc

  # ── Database: PostgreSQL (Primary Relational DB) ───────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/irc
    username: ${DB_USERNAME:khi}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA Configuration (PostgreSQL) ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
        query:
          in_clause_parameter_padding: true

  # ── SQL init disabled (no mock/seed data) ──────────────────────────────────────
  sql:
    init:
      mode: never

  # ── Cassandra Configuration (Time-Series & Events) ────────────────────────────
  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:irc_keyspace}
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    username: ${CASSANDRA_USERNAME:cassandra}
    password: ${CASSANDRA_PASSWORD:cassandra}

    # Schema action: CREATE_IF_NOT_EXISTS, CREATE, UPDATE, NONE
    schema-action: create_if_not_exists

    # Connection pool settings
    pool:
      heartbeat-interval: 30s
      idle-timeout: 5m
      max-queue-size: 256

    # Request settings
    request:
      timeout: 10s
      consistency: LOCAL_ONE

  # ── Redis ──────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── Scheduler pool ─────────────────────────────────────────────────────────────
  # Seven SSE heartbeat sweeps + trending/expiry/publish jobs all run on the
  # @Scheduled scheduler. The Spring default pool size is 1, which lets a
  # single slow SSE client socket stall every heartbeat and every job in the
  # app. Four threads keeps heartbeats isolated from long-running jobs.
  task:
    scheduling:
      pool:
        size: 4

  # ── OAuth2 Client ──────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ── RabbitMQ ───────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
    template:
      mandatory: true

  # ── Jackson ────────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

  # ── Mail (SMTP) ────────────────────────────────────────────────────────────────
  # Gmail / Google Workspace:
  #   1. Turn on 2-Step Verification on the sending Google account.
  #   2. Generate an "App password" — use that as MAIL_PASSWORD (not the login password).
  #   3. Set MAIL_USERNAME = <full email address>.
  # Custom SMTP: override MAIL_HOST / MAIL_PORT.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ika.center26@gmail.com}
    password: ${MAIL_PASSWORD:dbfrczyhfkxqylwn}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false

  # ── File Upload ────────────────────────────────────────────────────────────────
  # Servlet cap must clear media.limits.video-max-bytes (512MB) or Tomcat rejects
  # 500–512MB files before MediaIngestService can produce a proper error.
  servlet:
    multipart:
      max-file-size: 520MB
      max-request-size: 560MB

  web:
    resources:
      add-mappings: false


# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM CORE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  doi:
    prefix: "10.12345"

  # The FRONTEND origin that share links (live streams, channels, …) point at —
  # NOT the API. Dev default targets the Vite dev server; override IRC_BASE_URL to
  # the real web origin in prod. A wrong value here mints dead share links.
  base-url: ${IRC_BASE_URL:http://localhost:5173}

  # Notification email branding + reply-to.
  email:
    # Resolves to ${MAIL_FROM} → ${spring.mail.username} (which itself defaults
    # to MAIL_USERNAME from the spring.mail block) → a no-reply placeholder.
    # Reading spring.mail.username here (instead of MAIL_USERNAME directly)
    # means the YAML default chain is honoured even when the env var is unset.
    from-address: ${MAIL_FROM:${spring.mail.username:no-reply@irc.example.com}}
    from-name: ${MAIL_FROM_NAME:Hikmah Web}
    enabled: ${MAIL_ENABLED:true}
    # Throttle window — same (recipient, groupKey) won't be emailed twice
    # inside this duration. Mirrors the in-app aggregation window.
    throttle-minutes: ${MAIL_THROTTLE_MINUTES:60}

  verification:
    secret: ${IRC_VERIFICATION_SECRET:9fK2LmQ7xA4vZpR8sD1cYwN5TgH3UeB6}

  # Cassandra configuration (for events, audit logs, notifications)
  cassandra:
    enabled: ${CASSANDRA_ENABLED:true}
    max-batch-size: 1000
    async-enabled: true


# ═══════════════════════════════════════════════════════════════════════════════
#  APPLICATION SPECIFIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
app:

  jwt:
    secret: ${APP_JWT_SECRET:XyZ9aBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJk=}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: irc-platform

  security:
    # SECURE BY DEFAULT: method security (@PreAuthorize on every controller)
    # is enforced. Set SECURITY_PERMIT_ALL=true ONLY for throwaway local
    # testing where you want annotations ignored — never in production.
    permit-all: ${SECURITY_PERMIT_ALL:false}
    # Step-up authentication window (Settings §22.3) — how long a fresh
    # password/OTP re-auth stays valid for sensitive actions.
    step-up:
      ttl-seconds: ${STEP_UP_TTL_SECONDS:300}
    # TOTP two-factor (Settings §12). secret-key encrypts the TOTP secret at
    # rest (AES-GCM); MUST be set in production or enrolled secrets do not
    # survive a restart.
    twofa:
      issuer: ${TWOFA_ISSUER:IRC}
      secret-key: ${TWOFA_AES_KEY:}
      recovery-code-count: 10
      allowed-drift-steps: 1
    # Server pepper for the phone-number HMAC (Settings §3). Lives only in the
    # environment, never in the mobile app, never in the database.
    contact:
      pepper: ${CONTACT_PEPPER:}

  # One-Time Password / phone verification (Settings §2). The pepper is used to
  # HMAC the code — the plaintext code is never stored.
  otp:
    code-length: 6
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: 5
    # How the code reaches the user (OtpDeliveryService):
    #   email — mail it to the account address (default; no SMS gateway needed)
    #   sms   — hand to SmsSender; today that is LoggingSmsSender, i.e. log only,
    #           until a real gateway (Twilio, a local Iraqi aggregator) is wired
    #   log   — never send; the code appears in the application log only
    delivery: ${OTP_DELIVERY:email}
    pepper: ${OTP_PEPPER:}
    resend-per-number-per-hour: 3
    resend-per-ip-per-hour: 10

  # Default country calling code for E.164 normalization (Settings §2). Iraq = 964.
  phone:
    default-calling-code: ${PHONE_DEFAULT_CALLING_CODE:964}

  # Resolved-settings cache TTL (Settings §22.2).
  settings:
    cache-ttl-seconds: ${SETTINGS_CACHE_TTL_SECONDS:600}

  # Mobile push delivery (Settings §8). `provider` selects the PushSender bean:
  #   expo — the router (PushSenderRouter): EXPO rows (ExponentPushToken[...])
  #          go to Expo's push API, FCM rows (native device tokens) direct to
  #          the FCM HTTP v1 API; tokens the provider reports as unregistered
  #          are pruned (token hygiene)
  #   noop — log the intended delivery only (no credentials needed)
  # Delivery is gated per event by the §8 preference matrix + DND window;
  # incoming-call rings push directly on the calls_v1 channel.
  push:
    provider: ${PUSH_PROVIDER:expo}
    expo:
      url: https://exp.host/--/api/v2/push/send
      timeout-ms: 10000
    fcm:
      # Firebase service-account JSON for the FCM HTTP v1 API — download from
      # Firebase console → Project settings → Service accounts → Generate new
      # private key, and drop the file at this path (backend repo root by
      # default). Missing file: one startup warning, FCM sends treated as
      # delivered (no pruning); adding the file requires a restart.
      service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:${user.dir}/firebase-service-account.json}
      timeout-ms: 10000

  # About / app-config + policy versions (Settings §19). minSupportedVersion +
  # forceUpdate drive the client version gate served at GET /api/v1/app/config.
  about:
    min-supported-version: ${APP_MIN_VERSION:1.0.0}
    force-update: ${APP_FORCE_UPDATE:false}
    latest-version: ${APP_LATEST_VERSION:1.0.0}
    privacy-policy-version: "2026-08-01"
    terms-version: "2026-08-01"
    guidelines-version: "2026-08-01"

  # Live-streaming media plane. The app never proxies audio/video — it only hands
  # clients these origins and authorizes the media server's publish/read calls.
  # Local dev: the `mediamtx` service in docker-compose.yml. Four surfaces:
  #   webrtc-base  (:8889) — browser camera publishes via WHIP; viewers watch via WHEP
  #   ingest-base  (:1935) — OBS/ffmpeg publish via RTMP
  #   playback-base(:8888) — viewers watch via HLS
  # Publish + playback share the public stream-id path; the publish URLs (WHIP/RTMP)
  # additionally carry the secret streamKey (?pass=), which the media server forwards
  # to the auth hook — so only the host can publish. See MediaAuthController +
  # LiveStreamService.authorizeMediaAccess.
  streaming:
    # LAN IP, not localhost: these origins are handed VERBATIM to clients, and
    # on a phone `localhost` is the phone. Keep in sync with the machine's
    # address (same value as EXPO_PUBLIC_API_BASE_URL in the mobile app's .env
    # and webrtcAdditionalHosts in mediamtx.yml); env vars still override.
    webrtc-base: ${STREAM_WEBRTC_BASE:http://192.168.33.19:8889}
    ingest-base: ${STREAM_INGEST_BASE:rtmp://192.168.33.19:1935}
    playback-base: ${STREAM_PLAYBACK_BASE:http://192.168.33.19:8888}
    # Shared secret in the media-auth hook URL — MediaMTX (mediamtx.yml
    # authHTTPAddress) MUST use the same value. Keep the two in sync; override
    # both in production.
    auth-secret: ${STREAM_AUTH_SECRET:dev-media-auth-secret}
    # Where MediaMTX writes recordings (mediamtx.yml recordPath → /recordings,
    # bind-mounted here). The backend reads/serves owner downloads from this dir.
    recordings-dir: ${STREAM_RECORDINGS_DIR:./recordings}
    # ffmpeg binary used to JOIN a multi-take recording into one file at stream end
    # (re-encode, not stream-copy — see RecordingStorageService.combineParts). MUST
    # be on the backend host's PATH, or set an absolute path here. Missing ⇒ the
    # join silently no-ops and the recording stays multi-part (degraded, not broken).
    ffmpeg-bin: ${STREAM_FFMPEG_BIN:ffmpeg}
    # MediaMTX Control API (mediamtx.yml api: yes → :9997, published to localhost).
    # The backend calls it to enable recording PER STREAM (only opted-in streams
    # ever touch disk). Keep this reachable only from the app, never public.
    control-api-base: ${STREAM_CONTROL_API_BASE:http://localhost:9997}
    recording:
      # Default when a go-live request omits `record`. Opt-in by default.
      default-on: ${STREAM_RECORDING_DEFAULT_ON:false}
    stage:
      # TikTok-style multi-guest "stage": how many guests can be UP and talking
      # beside the host at once (the host is always on and does not count). Each
      # guest publishes their own camera to their own media path; everyone
      # subscribes to every active guest, so keep this modest.
      max-guests: ${STREAM_STAGE_MAX_GUESTS:6}

  # ── Automated text moderation (docs/moderation/MODERATION_ROADMAP.md §20) ────
  # Everything here is a BOOTSTRAP default. Thresholds, hold durations, fallback
  # policy and per-entity enablement are all overridable at runtime from
  # /api/v1/admin/moderation/settings, which writes the moderation_settings
  # table — that is what lets an admin retune sensitivity without redeploying
  # either service. A key with no DB row inherits the value below.
  #
  # The model itself runs as two Python containers (docker-compose.yml):
  #   model-inference :8000  — pure scorer, text → six probabilities
  #   model-training  :8001  — on-demand fine-tune, profile "on-demand"
  # Start at least model-inference, or held content follows the fallback policy
  # per entity type instead of being auto-decided.
  moderation:
    # MODERATION-FIRST BY DEFAULT. Set MODERATION_ENABLED=false ONLY for local
    # testing where you do not want to run the model container — the keyword
    # blocklist still applies, but nothing is scored and everything publishes
    # immediately. Never in production. (Same spirit as app.security.permit-all.)
    enabled: ${MODERATION_ENABLED:true}

    # Fields with fewer words than this skip the model — the blocklist alone
    # screens them. Below ~4 words the v4 classifier emits noise, not signal
    # (unseen English words collapse to one constant score vector; short benign
    # Kurdish greetings score 0.99+, indistinguishable from real slurs), so
    # scoring them only manufactures false holds. Runtime override:
    # moderation_settings key `text.min-scorable-words`. 0 scores everything.
    min-scorable-words: ${MODERATION_MIN_SCORABLE_WORDS:4}

    inference:
      base-url: ${MODERATION_INFERENCE_URL:http://localhost:8000}
      # Must match INFERENCE_API_KEY on the container. Empty = no auth header,
      # which is acceptable only because the container is meant to stay on the
      # internal network (§15).
      api-key: ${MODERATION_INFERENCE_API_KEY:}
      connect-timeout-ms: 1000
      # Hard ceiling for ANY single call. Per-entity inline budgets below are
      # clamped under this and under half the hold ceiling, so the sweeper can
      # never fire while a request thread is still waiting on the same case.
      timeout-ms: ${MODERATION_INFERENCE_TIMEOUT_MS:5000}
      max-attempts: 2
      retry-backoff-ms: 200
      circuit-window: 20
      circuit-failure-rate-percent: 50
      circuit-open-ms: 10000
      max-batch-items: 32

    training:
      base-url: ${MODERATION_TRAINING_URL:http://localhost:8001}
      api-key: ${MODERATION_TRAINING_API_KEY:}
      timeout-ms: 30000
      # The training container runs in Docker and calls back to the backend on
      # the host. Leave empty to rely on polling alone.
      callback-url: ${MODERATION_TRAINING_CALLBACK_URL:}
      callback-token: ${MODERATION_TRAINING_CALLBACK_TOKEN:}
      max-examples: 20000

    retrain:
      # §12.4 promotion gate: no per-label F1 may drop more than this vs active.
      max-f1-drop: 0.02
      require-human-promote: true
      min-examples: 20
      poll-interval-ms: 15000

    # §6 real-time exception. Borderline live-chat lines default to HIDDEN:
    # there is no review queue that catches up later for a live stream.
    live-chat:
      buffer-ms: 3000
      borderline-hidden: true

    # ── NSFW image screening (docs/moderation/image-moderation.md) ──────────
    # The scorer runs as a third Python container (docker-compose.yml):
    #   image-inference :8002 — Falconsai/nsfw_image_detection, image → nsfw/normal
    # Decided INLINE at ingest, before a byte is stored — no quarantine phase.
    # Thresholds/fallback/enabled are bootstrap defaults; image.* keys in
    # moderation_settings override them at runtime from the admin dashboard.
    # The master MODERATION_ENABLED switch above also kills this gate.
    image:
      enabled: ${IMAGE_MODERATION_ENABLED:true}
      base-url: ${IMAGE_MODERATION_URL:http://localhost:8002}
      # Must match IMAGE_INFERENCE_API_KEY on the container. Empty = no header.
      api-key: ${IMAGE_MODERATION_API_KEY:}
      connect-timeout-ms: 1000
      # Payloads are pre-scaled to ≤512px thumbnails before sending (see
      # prescale-max-dim), so a tight ceiling is safe and fails fast.
      timeout-ms: ${IMAGE_MODERATION_TIMEOUT_MS:4000}
      max-attempts: 2
      retry-backoff-ms: 200
      circuit-window: 20
      circuit-failure-rate-percent: 50
      circuit-open-ms: 10000
      # nsfw ≥ block  → upload rejected (MEDIA_NSFW_BLOCKED), nothing stored.
      # review ≤ nsfw < block → publishes, filed into the admin review queue.
      # PRECISION-TUNED: the target is pornographic/explicit content ONLY.
      # Real explicit content scores ≥0.95 on this checkpoint almost always;
      # portraits/beach/skin-adjacent benign images must pass without review.
      block-threshold: 0.90
      review-threshold: 0.80
      # Longest edge sent to the scorer; the model works at 224×224 anyway.
      # The dominant upload-latency lever. 0 = send originals verbatim.
      prescale-max-dim: 512
      # Scorer down: FAIL_OPEN_SHADOW publishes + queues for review (default —
      # an outage must not take image uploads down); FAIL_CLOSED refuses with 503.
      fallback: FAIL_OPEN_SHADOW
      # Also screen the extracted poster frame of every uploaded video.
      score-video-posters: true

    # SLA sweeper cadence (§5.6). Runs independently of the queue so held content
    # still reaches a defined outcome when the broker or the model is down.
    sweeper:
      initial-delay-ms: 20000
      interval-ms: 5000

    # §8.1 starting bands, per label. Retune from the dashboard once a real
    # validation set exists — these are a sane bootstrap, not a tuned policy.
    # threat/identity_hate sit lower on purpose: a false negative there costs
    # far more than a false positive.
    thresholds:
      toxic:         { low: 0.30, high: 0.80 }
      severe_toxic:  { low: 0.20, high: 0.60 }
      obscene:       { low: 0.30, high: 0.80 }
      threat:        { low: 0.15, high: 0.50 }
      insult:        { low: 0.30, high: 0.80 }
      identity_hate: { low: 0.15, high: 0.55 }

    # §5.3 hard hold ceilings — the MAXIMUM wait, not a fixed delay. Clean
    # content clears inline in well under a second and never waits this long.
    hold-ms:
      post: 30000
      post_comment: 10000
      story: 15000
      story_poll: 15000
      research: 60000
      research_comment: 10000
      qna_question: 30000
      qna_answer: 30000
      chat_message: 10000
      channel: 30000
      stream_meta: 30000
      live_chat: 5000
      content_annotation: 10000

    # §5.3 target auto-decision times — the synchronous budget on the request
    # thread before the unit is handed to the queue.
    inline-ms:
      post: 2000
      post_comment: 500
      story: 1000
      story_poll: 1000
      research: 5000
      research_comment: 500
      qna_question: 2000
      qna_answer: 2000
      chat_message: 500
      channel: 2000
      stream_meta: 2000
      live_chat: 300
      content_annotation: 500

    # §5.6 / §20 fallback when the hold window expires with no verdict.
    # fail_closed → hidden, top of the admin queue, SLA-breached flag.
    # fail_open_shadow → published + flagged; only for short-lived, low-risk types.
    fallback:
      post: fail_closed
      post_comment: fail_closed
      story: fail_open_shadow
      story_poll: fail_open_shadow
      research: fail_closed
      research_comment: fail_closed
      qna_question: fail_closed
      qna_answer: fail_closed
      chat_message: fail_closed
      channel: fail_closed
      stream_meta: fail_closed
      live_chat: fail_closed
      content_annotation: fail_closed

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.1.118:3000,http://192.168.1.118:5173,http://192.168.1.118:8080}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_HEADERS:*}
    allow-credentials: ${CORS_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  oauth2:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    authorized-redirect-uris: ${OAUTH_AUTHORIZED_URIS:http://localhost:3000/oauth2/callback,http://localhost:5173/oauth2/callback,http://192.168.1.118:3000/oauth2/callback,http://192.168.1.118:5173/oauth2/callback}

  storage:
    endpoint: ${R2_ENDPOINT:https://55dce88e6a5db45662dc27ef50d83c2a.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:d06b80c862aca3f99a7dc4733ad26411}
    secret-key: ${R2_SECRET_KEY:4dbb16899e5b4416c5acb94da9c47aed9d6861ec392fdb0745f75f7b3d992314}
    bucket-name: ${R2_BUCKET_NAME:irc}
    public-url-base: ${R2_PUBLIC_URL:https://pub-55dce88e6a5db45662dc27ef50d83c2a.r2.dev}
    region: ${R2_REGION:auto}


# ═══════════════════════════════════════════════════════════════════════════════
#  MEDIA UPLOAD, QUALITY & COMPRESSION POLICY  (Settings §20)
# ═══════════════════════════════════════════════════════════════════════════════
# The user chooses their preferred upload tier; the BACKEND enforces the maximum.
# Every uploaded asset is re-encoded and reduced in size on the server.
#   VIDEO  → short edge hard-capped at 1080 px (do NOT raise max-short-edge).
#   IMAGE  → long edge capped at HD class (1920 px), metadata stripped.
# All caps live here (not in code) so they can be tuned without a release.
media:
  image:
    max-long-edge: 1920          # HD / Full-HD class cap
    chat-max-long-edge: 1280
    profile-edge: 512
    avif-quality: 55
    webp-quality: 80
    jpeg-quality: 82             # progressive JPEG (pure-JDK guaranteed output)
    thumb-edge: 320              # list/feed thumbnail long edge
    square-thumb-edge: 150       # square-crop micro thumb
    webp-enabled: true           # still WebP via ffmpeg; auto-off when the binary is absent
    webp-timeout-seconds: 10
    sync-budget-ms: 8000         # in-request budget; WebP rungs skipped past it
    max-concurrent: 3            # concurrent in-request image decodes (heap guard)
  video:
    max-short-edge: 1080         # HARD CAP — do not raise
    max-fps: 30
    crf: 23
    audio-bitrate: 128k
    # H.264 rendition ladder (ascending; rungs larger than the source are skipped —
    # never upscale). Remove the block to fall back to identical code defaults.
    ladder:
      - { label: 360p,  short-edge: 360,  crf: 26, maxrate: 800k,  bufsize: 1600k,  audio-bitrate: 96k }
      - { label: 480p,  short-edge: 480,  crf: 25, maxrate: 1400k, bufsize: 2800k,  audio-bitrate: 128k }
      - { label: 720p,  short-edge: 720,  crf: 23, maxrate: 2800k, bufsize: 5600k,  audio-bitrate: 128k }
      - { label: 1080p, short-edge: 1080, crf: 23, maxrate: 5000k, bufsize: 10000k, audio-bitrate: 128k }
    duration-caps:
      video-clip-seconds: 90     # reels/clips
      film-seconds: 600
      video-seconds: 600         # generic uploaded video (posts/chat default type)
    # CMAF/fMP4 HLS packaging of the ladder (a -c copy remux — cheap). Only
    # active alongside media.processing.enabled=true; ships as the `hls`
    # variant key + FeedItemResponse.videoHlsUrl without touching MP4 URLs.
    hls:
      enabled: ${MEDIA_HLS_ENABLED:true}
      segment-seconds: 4         # fMP4 segment target (snaps to keyframe grid)
      keyframe-seconds: 2        # forced IDR grid — aligns rungs for seamless ABR
      start-label: 480p          # master playlist leads with this rung (fast start)
    # Short animated WebP hover/scrub preview (soft-fail, like the poster).
    preview:
      enabled: ${MEDIA_PREVIEW_ENABLED:true}
      seconds: 2.5
      fps: 12
      edge: 240
      quality: 45
    # Days after READY before a video's stored original is purged (object+row).
    # Requires an HLS master to exist. -1 disables (default) — flipping this on
    # is an explicit storage-cost decision (original is the dedup/re-ladder source).
    purge-ladder-original-after-days: ${MEDIA_PURGE_LADDER_ORIGINAL_DAYS:-1}
  limits:
    image-max-bytes: 26214400    # 25 MB
    video-max-bytes: 536870912   # 512 MB
    audio-max-bytes: 20971520    # 20 MB (voice notes, sound uploads)
    file-max-bytes: 104857600    # 100 MB (documents/attachments)
    max-input-megapixels: 100    # decompression-bomb guard (rejected before decode)
  processing:
    # Video transcode uses these binaries when enabled=true; otherwise the
    # passthrough transcoder stores the validated original (self-contained dev).
    ffmpeg-bin: ${MEDIA_FFMPEG_BIN:${app.streaming.ffmpeg-bin:ffmpeg}}
    ffprobe-bin: ${MEDIA_FFPROBE_BIN:ffprobe}
    enabled: ${MEDIA_TRANSCODE_ENABLED:false}
    timeout-seconds: 600
    worker-concurrency: 1        # media.process Rabbit consumers (ffmpeg saturates cores)
    max-attempts: 3              # sweeper republish ceiling → FAILED_PROCESSING after
    stuck-after-seconds: 3600    # PROCESSING staleness before the sweeper intervenes
    sweeper-initial-delay-ms: 30000
    sweeper-interval-ms: 60000
  ingest:
    # Kill switch — false restores pre-pipeline behavior on every multipart surface
    # (original bytes straight to storage, no asset rows, no variants).
    enabled: ${MEDIA_INGEST_ENABLED:true}
    # false → video ingest stores original+poster only (no ladder queue publish).
    video-async-enabled: ${MEDIA_VIDEO_ASYNC_ENABLED:true}
    # Per-role daily quotas (media_quotas) on all ingest surfaces. The demo seeder
    # can trip the USER 100/day default — disable here or raise via the admin API.
    quota-enabled: ${MEDIA_INGEST_QUOTA_ENABLED:true}
  # ── Read-side delivery policy (all defaults = today's behavior) ──────────────
  serving:
    # CDN base URL; empty → proxy-relative URLs exactly as before. With a base:
    #   PROXY  mode — CDN origin is this app  → {base}/api/v1/media/{key}
    #   BUCKET mode — CDN fronts the bucket   → {base}/{key}   (no app hop)
    cdn-base: ${MEDIA_CDN_BASE:}
    cdn-mode: ${MEDIA_CDN_MODE:PROXY}
    # HMAC-signed playback URLs — enforcement is scoped to protected-prefixes,
    # so flipping this on never breaks existing public URLs.
    signed-urls-enabled: ${MEDIA_SIGNED_URLS_ENABLED:false}
    signing-secret: ${MEDIA_SIGNING_SECRET:}
    signed-url-ttl-seconds: 3600
    # protected-prefixes:
    #   - media-private/
  # Optional per-surface cap overrides (code defaults live on MediaSurface), e.g.:
  # surfaces:
  #   story:      { max-duration-seconds: 60 }
  #   chat-media: { max-duration-seconds: 180, max-count: 10 }


# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    ak.dev.irc: DEBUG
    ak.dev.irc.security: DEBUG
    ak.dev.irc.irc_security.rabbitmq: DEBUG
    org.springframework.security: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    # Quiet retry-storm noise when RabbitMQ / Cassandra aren't running locally.
    # Set to INFO/DEBUG when actually debugging broker/driver issues.
    org.springframework.amqp.rabbit.listener: OFF
    org.springframework.amqp.rabbit.connection: OFF
    org.springframework.amqp: WARN
    org.springframework.data.cassandra: WARN
    com.datastax.oss.driver: ERROR
    org.hibernate.SQL: WARN
    org.hibernate: WARN
    io.netty: ERROR
    io.netty.util.internal: ERROR
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ═══════════════════════════════════════════════════════════════════════════════
#  SERVER
# ═══════════════════════════════════════════════════════════════════════════════
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

kind: Application