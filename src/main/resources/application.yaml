# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — APPLICATION CONFIGURATION (UPDATED WITH CASSANDRA)
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: irc

  # ── Database: PostgreSQL (Primary Relational DB) ───────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/irc
    username: ${DB_USERNAME:khi}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA Configuration (PostgreSQL) ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
        query:
          in_clause_parameter_padding: true

  # ── SQL init disabled (no mock/seed data) ──────────────────────────────────────
  sql:
    init:
      mode: never

  # ── Cassandra Configuration (Time-Series & Events) ────────────────────────────
  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:irc_keyspace}
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    username: ${CASSANDRA_USERNAME:cassandra}
    password: ${CASSANDRA_PASSWORD:cassandra}

    # Schema action: CREATE_IF_NOT_EXISTS, CREATE, UPDATE, NONE
    schema-action: create_if_not_exists

    # Connection pool settings
    pool:
      heartbeat-interval: 30s
      idle-timeout: 5m
      max-queue-size: 256

    # Request settings
    request:
      timeout: 10s
      consistency: LOCAL_ONE

  # ── Redis ──────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── Scheduler pool ─────────────────────────────────────────────────────────────
  # Seven SSE heartbeat sweeps + trending/expiry/publish jobs all run on the
  # @Scheduled scheduler. The Spring default pool size is 1, which lets a
  # single slow SSE client socket stall every heartbeat and every job in the
  # app. Four threads keeps heartbeats isolated from long-running jobs.
  task:
    scheduling:
      pool:
        size: 4

  # ── OAuth2 Client ──────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ── RabbitMQ ───────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
    template:
      mandatory: true

  # ── Jackson ────────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

  # ── Mail (SMTP) ────────────────────────────────────────────────────────────────
  # Gmail / Google Workspace:
  #   1. Turn on 2-Step Verification on the sending Google account.
  #   2. Generate an "App password" — use that as MAIL_PASSWORD (not the login password).
  #   3. Set MAIL_USERNAME = <full email address>.
  # Custom SMTP: override MAIL_HOST / MAIL_PORT.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ika.center26@gmail.com}
    password: ${MAIL_PASSWORD:dbfrczyhfkxqylwn}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false

  # ── File Upload ────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  web:
    resources:
      add-mappings: false


# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM CORE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  doi:
    prefix: "10.12345"

  # The FRONTEND origin that share links (live streams, channels, …) point at —
  # NOT the API. Dev default targets the Vite dev server; override IRC_BASE_URL to
  # the real web origin in prod. A wrong value here mints dead share links.
  base-url: ${IRC_BASE_URL:http://localhost:5173}

  # Notification email branding + reply-to.
  email:
    # Resolves to ${MAIL_FROM} → ${spring.mail.username} (which itself defaults
    # to MAIL_USERNAME from the spring.mail block) → a no-reply placeholder.
    # Reading spring.mail.username here (instead of MAIL_USERNAME directly)
    # means the YAML default chain is honoured even when the env var is unset.
    from-address: ${MAIL_FROM:${spring.mail.username:no-reply@irc.example.com}}
    from-name: ${MAIL_FROM_NAME:IRC Platform}
    enabled: ${MAIL_ENABLED:true}
    # Throttle window — same (recipient, groupKey) won't be emailed twice
    # inside this duration. Mirrors the in-app aggregation window.
    throttle-minutes: ${MAIL_THROTTLE_MINUTES:60}

  verification:
    secret: ${IRC_VERIFICATION_SECRET:9fK2LmQ7xA4vZpR8sD1cYwN5TgH3UeB6}

  # Cassandra configuration (for events, audit logs, notifications)
  cassandra:
    enabled: ${CASSANDRA_ENABLED:true}
    max-batch-size: 1000
    async-enabled: true


# ═══════════════════════════════════════════════════════════════════════════════
#  APPLICATION SPECIFIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
app:

  jwt:
    secret: ${APP_JWT_SECRET:XyZ9aBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJk=}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: irc-platform

  security:
    # SECURE BY DEFAULT: method security (@PreAuthorize on every controller)
    # is enforced. Set SECURITY_PERMIT_ALL=true ONLY for throwaway local
    # testing where you want annotations ignored — never in production.
    permit-all: ${SECURITY_PERMIT_ALL:false}

  # Live-streaming media plane. The app never proxies audio/video — it only hands
  # clients these origins and authorizes the media server's publish/read calls.
  # Local dev: the `mediamtx` service in docker-compose.yml. Four surfaces:
  #   webrtc-base  (:8889) — browser camera publishes via WHIP; viewers watch via WHEP
  #   ingest-base  (:1935) — OBS/ffmpeg publish via RTMP
  #   playback-base(:8888) — viewers watch via HLS
  # Publish + playback share the public stream-id path; the publish URLs (WHIP/RTMP)
  # additionally carry the secret streamKey (?pass=), which the media server forwards
  # to the auth hook — so only the host can publish. See MediaAuthController +
  # LiveStreamService.authorizeMediaAccess.
  streaming:
    webrtc-base: ${STREAM_WEBRTC_BASE:http://localhost:8889}
    ingest-base: ${STREAM_INGEST_BASE:rtmp://localhost:1935}
    playback-base: ${STREAM_PLAYBACK_BASE:http://localhost:8888}
    # Shared secret in the media-auth hook URL — MediaMTX (mediamtx.yml
    # authHTTPAddress) MUST use the same value. Keep the two in sync; override
    # both in production.
    auth-secret: ${STREAM_AUTH_SECRET:dev-media-auth-secret}
    # Where MediaMTX writes recordings (mediamtx.yml recordPath → /recordings,
    # bind-mounted here). The backend reads/serves owner downloads from this dir.
    recordings-dir: ${STREAM_RECORDINGS_DIR:./recordings}
    # ffmpeg binary used to JOIN a multi-take recording into one file at stream end
    # (re-encode, not stream-copy — see RecordingStorageService.combineParts). MUST
    # be on the backend host's PATH, or set an absolute path here. Missing ⇒ the
    # join silently no-ops and the recording stays multi-part (degraded, not broken).
    ffmpeg-bin: ${STREAM_FFMPEG_BIN:ffmpeg}
    # MediaMTX Control API (mediamtx.yml api: yes → :9997, published to localhost).
    # The backend calls it to enable recording PER STREAM (only opted-in streams
    # ever touch disk). Keep this reachable only from the app, never public.
    control-api-base: ${STREAM_CONTROL_API_BASE:http://localhost:9997}
    recording:
      # Default when a go-live request omits `record`. Opt-in by default.
      default-on: ${STREAM_RECORDING_DEFAULT_ON:false}
    stage:
      # TikTok-style multi-guest "stage": how many guests can be UP and talking
      # beside the host at once (the host is always on and does not count). Each
      # guest publishes their own camera to their own media path; everyone
      # subscribes to every active guest, so keep this modest.
      max-guests: ${STREAM_STAGE_MAX_GUESTS:6}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.1.118:3000,http://192.168.1.118:5173,http://192.168.1.118:8080}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_HEADERS:*}
    allow-credentials: ${CORS_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  oauth2:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    authorized-redirect-uris: ${OAUTH_AUTHORIZED_URIS:http://localhost:3000/oauth2/callback,http://localhost:5173/oauth2/callback,http://192.168.1.118:3000/oauth2/callback,http://192.168.1.118:5173/oauth2/callback}

  storage:
    endpoint: ${R2_ENDPOINT:https://55dce88e6a5db45662dc27ef50d83c2a.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:d06b80c862aca3f99a7dc4733ad26411}
    secret-key: ${R2_SECRET_KEY:4dbb16899e5b4416c5acb94da9c47aed9d6861ec392fdb0745f75f7b3d992314}
    bucket-name: ${R2_BUCKET_NAME:irc}
    public-url-base: ${R2_PUBLIC_URL:https://pub-55dce88e6a5db45662dc27ef50d83c2a.r2.dev}
    region: ${R2_REGION:auto}


# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    ak.dev.irc: DEBUG
    ak.dev.irc.security: DEBUG
    ak.dev.irc.irc_security.rabbitmq: DEBUG
    org.springframework.security: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    # Quiet retry-storm noise when RabbitMQ / Cassandra aren't running locally.
    # Set to INFO/DEBUG when actually debugging broker/driver issues.
    org.springframework.amqp.rabbit.listener: OFF
    org.springframework.amqp.rabbit.connection: OFF
    org.springframework.amqp: WARN
    org.springframework.data.cassandra: WARN
    com.datastax.oss.driver: ERROR
    org.hibernate.SQL: WARN
    org.hibernate: WARN
    io.netty: ERROR
    io.netty.util.internal: ERROR
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ═══════════════════════════════════════════════════════════════════════════════
#  SERVER
# ═══════════════════════════════════════════════════════════════════════════════
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

kind: Application