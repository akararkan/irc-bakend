# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — APPLICATION CONFIGURATION
#
#  ONE file. Every value is overridable through an environment variable.
#  - Local dev: just `./mvnw spring-boot:run` — the localhost defaults below
#    work against `docker compose up` (Postgres / Redis / RabbitMQ).
#  - Railway:   set the env vars listed in .env.example, deploy, done.
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: irc

  # ── Database ──────────────────────────────────────────────────────────────────
  # On Railway: set SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME /
  # SPRING_DATASOURCE_PASSWORD (Spring Boot reads them automatically).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/irc}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:khi}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ───────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          fetch_size: 50
          # Force every TIMESTAMP write/read through UTC. Without this Hibernate
          # uses the JVM default, so a non-UTC container would silently write
          # local-time values into the DB and the frontend would show wrong
          # relative times ("3 hours ago" right after posting).
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
        query:
          in_clause_parameter_padding: true

  # ── SQL init (runs schema.sql / data.sql AFTER Hibernate DDL) ──────────────
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # Railway's "Redis" plugin gives a single REDIS_URL. Set
  # SPRING_DATA_REDIS_URL=$REDIS_URL in the service variables — it wins.
  data:
    redis:
      url:      ${SPRING_DATA_REDIS_URL:}
      host:     ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port:     ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    host:         ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port:         ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username:     ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
    password:     ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:${RABBITMQ_VHOST:/}}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
    template:
      mandatory: true

  # ── Jackson ───────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

  # ── Mail (SMTP) ──────────────────────────────────────────────────────────────
  # Gmail: turn on 2-Step, generate an App Password, use that as MAIL_PASSWORD.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false

  # ── File Upload ───────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}

  # ── MVC ───────────────────────────────────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true
    # SSE / async support — long timeout so the notification stream is not killed
    # by Spring's default 30s async-request-timeout. SseEmitter timeouts are still
    # honoured per-connection.
    async:
      request-timeout: 86400000

  web:
    resources:
      add-mappings: false


# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM CORE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  doi:
    prefix: ${DOI_PREFIX:10.12345}

  base-url: ${IRC_BASE_URL:http://localhost:8080}

  email:
    from-address: ${MAIL_FROM:${spring.mail.username:no-reply@irc.example.com}}
    from-name: ${MAIL_FROM_NAME:IRC Platform}
    enabled: ${MAIL_ENABLED:true}
    throttle-minutes: ${MAIL_THROTTLE_MINUTES:60}
    # Transport: "smtp" (local dev / providers that allow SMTP egress) or
    # "resend" (Railway / Heroku / Render / GCP / Fly — anywhere outbound
    # SMTP is blocked). Resend speaks HTTPS over 443 which every PaaS allows.
    # When set to "resend", RESEND_API_KEY must also be set.
    provider: ${MAIL_PROVIDER:smtp}
    reply-to: ${MAIL_REPLY_TO:}

  verification:
    # Override IRC_VERIFICATION_SECRET in production with `openssl rand -hex 24`.
    secret: ${IRC_VERIFICATION_SECRET:dev-only-32-char-verification-secret-xx}

# Resend HTTPS transport — generate a key at https://resend.com/api-keys
resend:
  api-key: ${RESEND_API_KEY:}


# ═══════════════════════════════════════════════════════════════════════════════
#  APPLICATION SPECIFIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#  JWT — keys read by JwtTokenProvider via @Value("${jwt.*}").
#  MUST be a top-level `jwt:` block (not `app.jwt`) — that's what the code
#  binds to. Missing this causes a "Could not resolve placeholder 'jwt.secret'"
#  failure on boot.
# ═══════════════════════════════════════════════════════════════════════════════
jwt:
  # Override APP_JWT_SECRET in production with `openssl rand -base64 64`.
  secret:             ${APP_JWT_SECRET:XyZ9aBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJk=}
  # Access 24h, refresh 90d — long sessions. Refresh rotates on use, so an
  # active user stays logged in indefinitely.
  expiration-ms:         ${APP_JWT_ACCESS_MS:86400000}
  refresh-expiration-ms: ${APP_JWT_REFRESH_MS:7776000000}
  issuer:                ${APP_JWT_ISSUER:irc-platform}
  # Cookie settings — IRC_TOKEN cookie carrying the access token. Set
  # JWT_COOKIE_SECURE=true on Railway (HTTPS) so the cookie is HTTPS-only.
  cookie-name:      ${JWT_COOKIE_NAME:IRC_TOKEN}
  cookie-secure:    ${JWT_COOKIE_SECURE:false}
  cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  cookie-path:      ${JWT_COOKIE_PATH:/}
  cookie-max-age:   ${JWT_COOKIE_MAX_AGE:86400}


# ═══════════════════════════════════════════════════════════════════════════════
#  STORAGE + CORS — bound under `app.*` to match the existing Java @Values.
# ═══════════════════════════════════════════════════════════════════════════════
app:

  # Public-facing frontend URL — used to build user-clickable links inside
  # emails and the social share preview pages (/p, /r, /q). Falls back to
  # the request origin when unset, so dev still works without env vars.
  frontend-url: ${FRONTEND_URL:https://irc-frontend-517u.vercel.app}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.1.118:3000,http://192.168.1.118:5173,http://192.168.1.118:8080}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_HEADERS:*}
    allow-credentials: ${CORS_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  storage:
    endpoint:        ${R2_ENDPOINT:}
    access-key:      ${R2_ACCESS_KEY:}
    secret-key:      ${R2_SECRET_KEY:}
    bucket-name:     ${R2_BUCKET_NAME:irc}
    public-url-base: ${R2_PUBLIC_URL:}
    region:          ${R2_REGION:auto}


# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING
#  Set LOG_LEVEL_APP=INFO (or WARN) on Railway for quieter prod logs.
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    ak.dev.irc: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN
    org.hibernate: WARN
    io.netty: ERROR
    io.netty.util.internal: ERROR
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ═══════════════════════════════════════════════════════════════════════════════
#  MANAGEMENT / OBSERVABILITY  — Railway healthcheck hits /actuator/health
# ═══════════════════════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true


# ═══════════════════════════════════════════════════════════════════════════════
#  SERVER  — Railway injects PORT, we honour both PORT and SERVER_PORT.
# ═══════════════════════════════════════════════════════════════════════════════
server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework        # honour X-Forwarded-* behind Railway's proxy
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
