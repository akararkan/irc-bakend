# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
#  CONFIGURATION CONTRACT
#  ──────────────────────
#  • Every value uses the form ${ENV_VAR:default}. Defaults are tuned for
#    **bare-metal local dev** (Postgres / Redis / RabbitMQ / Cassandra / ES
#    all on localhost, no auth). They are NOT safe for shared environments.
#  • In Railway / Docker / any deployment, override the env vars listed in
#    docs/USER_API.md (or your runbook). Every secret-bearing variable has
#    an EMPTY default — boot will fail loudly if the env var is missing
#    rather than silently using a committed credential.
#  • The two destructive schema actions (Postgres ddl-auto, Cassandra
#    schema-action) default to non-destructive values (`update`,
#    `CREATE_IF_NOT_EXISTS`). Set `JPA_DDL=create-drop` or
#    `CASSANDRA_SCHEMA_ACTION=RECREATE_DROP_UNUSED` explicitly when you
#    actually want to wipe.
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: irc

  # ── Boot speed knobs ────────────────────────────────────────────────────────
  # JMX off: ski MBean registration (~1s).
  # Banner off: cosmetic only.
  # NOTE: lazy-initialization is intentionally OFF — it makes the first request
  # to every controller slow (Spring builds the dependency graph on demand)
  # and can silently break @Scheduled jobs / SSE event publishers that need
  # to be eagerly instantiated. The bigger wins are ddl-auto=update and
  # schema-action=create_if_not_exists below.
  main:
    banner-mode: off
  jmx:
    enabled: false

  # DevTools auto-restart kills every open SSE connection on every recompile —
  # the browser then reconnects during the restart window and gets
  # NS_ERROR_CONNECTION_REFUSED. Keep DevTools loaded (LiveReload, dev props)
  # but disable the auto-restart so manual "Rerun" from IntelliJ is the only
  # thing that bounces the JVM. Set to true if you want hot-reload back.
  devtools:
    restart:
      enabled: ${DEVTOOLS_RESTART:false}
    livereload:
      enabled: true

  # ── Database: PostgreSQL (Primary Relational DB) ───────────────────────────────
  # URL externalized via DB_URL so containers (Railway, Docker, etc.) can point
  # at the right Postgres host without rebuilding. The localhost default is for
  # bare-metal dev only — if it ever leaks into a container the boot will hang
  # 30 s on Hikari connect-timeout and then crash the entire JPA bean graph.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/irc}
    username: ${DB_USERNAME:khi}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA Configuration (PostgreSQL) ──────────────────────────────────────────────
  jpa:
    hibernate:
      # Default is `update` — preserves Postgres data across restarts
      # (research, users, Q&A, notifications all survive). Boot is
      # dramatically faster because Hibernate only emits incremental schema
      # changes, not DROP + CREATE for every entity.
      #
      # ⚠️  PROD-SAFETY: previously defaulted to `create-drop`, which wiped
      # the schema on every redeploy. If you want a wipe locally:
      #   JPA_DDL=create-drop ./mvnw spring-boot:run
      # or:
      #   psql -U khi -d irc -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
      ddl-auto: ${JPA_DDL:update}
    open-in-view: false
    # show-sql off in dev → meaningful boot-time savings on a chatty schema.
    # Toggle with -Dspring.jpa.show-sql=true when you actually want SQL logs.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
        query:
          in_clause_parameter_padding: true
        # Skip Hibernate's bytecode enhancer scan on entities Hibernate hasn't
        # explicitly enhanced — cheap dev-time saving.
        bytecode:
          provider: bytebuddy

  # ── SQL init disabled (no mock/seed data) ──────────────────────────────────────
  sql:
    init:
      mode: never

  # ── Cassandra Configuration (Time-Series & Events) ────────────────────────────
  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:irc_keyspace}
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    username: ${CASSANDRA_USERNAME:cassandra}
    password: ${CASSANDRA_PASSWORD:cassandra}

    # Schema action: CREATE_IF_NOT_EXISTS, CREATE, RECREATE, RECREATE_DROP_UNUSED, NONE.
    # Default is `CREATE_IF_NOT_EXISTS` — fast path that skips DDL for
    # tables that already exist and preserves all Cassandra data (posts,
    # comments, notifications, stories, counters, tag indexes) across boots.
    #
    # ⚠️  PROD-SAFETY: previously defaulted to `RECREATE_DROP_UNUSED`, which
    # nuked the keyspace on every boot. When you actually want to wipe:
    #   CASSANDRA_SCHEMA_ACTION=RECREATE_DROP_UNUSED ./mvnw spring-boot:run
    # or:
    #   cqlsh -e "DROP KEYSPACE irc_keyspace;"
    schema-action: ${CASSANDRA_SCHEMA_ACTION:CREATE_IF_NOT_EXISTS}

    # Connection pool settings
    pool:
      heartbeat-interval: 30s
      idle-timeout: 5m
      max-queue-size: 256

    # Request settings
    request:
      # Bumped to 30s so the per-DDL schema-agreement round can complete
      # during RECREATE_DROP_UNUSED boots (each DROP/CREATE triggers a
      # cluster-wide schema-agreement protocol that can take 1–3s).
      timeout: 30s
      consistency: LOCAL_ONE

    # Control connection — drives DDL + schema agreement polling.
    # The defaults wait up to 10s per agreement; on a single-node dev
    # cluster the cluster IS in agreement immediately so we can poll
    # faster and bail out sooner. This shaves boot time during
    # RECREATE_DROP_UNUSED dramatically.
    controlconnection:
      schema-agreement:
        interval: 100ms       # default 200ms — poll twice as fast
        timeout:  2s          # default 10s — single-node never needs longer
        warn-on-failure: true

  # ── Elasticsearch (Search Engine: posts, users, hashtags) ─────────────────────
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 10s

  # ── Redis ──────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── OAuth2 Client ──────────────────────────────────────────────────────────────
  # Real values come from the Google Cloud Console → APIs & Services → Credentials.
  # Defaults are empty so a missing env var fails loudly at OAuth handshake
  # rather than silently using a placeholder credential.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ── RabbitMQ ───────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
    template:
      mandatory: true

  # ── Jackson ────────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

  # ── Mail (SMTP) ────────────────────────────────────────────────────────────────
  # Gmail / Google Workspace:
  #   1. Turn on 2-Step Verification on the sending Google account.
  #   2. Generate an "App password" — use that as MAIL_PASSWORD (not the login password).
  #   3. Set MAIL_USERNAME = <full email address>.
  # Custom SMTP: override MAIL_HOST / MAIL_PORT.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # MAIL_USERNAME / MAIL_PASSWORD must be set per environment.
    # Defaults are empty so a leaked-credential commit can't recur.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false

  # ── File Upload ────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # ── MVC ────────────────────────────────────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false


# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM CORE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  doi:
    prefix: "10.12345"

  base-url: "https://irc.example.com"

  # Notification email branding + reply-to.
  email:
    # Resolves to ${MAIL_FROM} → ${spring.mail.username} (which itself defaults
    # to MAIL_USERNAME from the spring.mail block) → a no-reply placeholder.
    # Reading spring.mail.username here (instead of MAIL_USERNAME directly)
    # means the YAML default chain is honoured even when the env var is unset.
    from-address: ${MAIL_FROM:${spring.mail.username:no-reply@irc.example.com}}
    from-name: ${MAIL_FROM_NAME:IRC Platform}
    enabled: ${MAIL_ENABLED:true}
    # Throttle window — same (recipient, groupKey) won't be emailed twice
    # inside this duration. Mirrors the in-app aggregation window.
    throttle-minutes: ${MAIL_THROTTLE_MINUTES:60}

  verification:
    # HMAC secret for IRC-ID verification hashes. Must be a stable random
    # string ≥ 32 chars — rotating it invalidates every existing hash.
    # No default: missing env var fails at first verification attempt
    # instead of silently using a committed value.
    secret: ${IRC_VERIFICATION_SECRET:}

  # Cassandra configuration (for events, audit logs, notifications)
  cassandra:
    enabled: ${CASSANDRA_ENABLED:true}
    max-batch-size: 1000
    async-enabled: true


# ═══════════════════════════════════════════════════════════════════════════════
#  APPLICATION SPECIFIC CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
app:

  jwt:
    # Signing key for every JWT issued by the platform. Must be a base64-
    # encoded random ≥ 64 bytes (use `openssl rand -base64 64`).
    # No default: missing env var fails JwtTokenProvider startup loud and
    # immediate — strictly better than running on a leaked / weak key.
    secret: ${APP_JWT_SECRET:}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
    issuer: irc-platform

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.1.118:3000,http://192.168.1.118:5173,http://192.168.1.118:8080}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_HEADERS:*}
    allow-credentials: ${CORS_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  oauth2:
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    authorized-redirect-uris: ${OAUTH_AUTHORIZED_URIS:http://localhost:3000/oauth2/callback,http://localhost:5173/oauth2/callback,http://192.168.1.118:3000/oauth2/callback,http://192.168.1.118:5173/oauth2/callback}

  storage:
    # Cloudflare R2 — all credentials live in env. The previous defaults
    # exposed the live R2 access/secret keys in git history; if you're
    # rotating after that leak, the new keys go ONLY here as env vars.
    endpoint:        ${R2_ENDPOINT:}
    access-key:      ${R2_ACCESS_KEY:}
    secret-key:      ${R2_SECRET_KEY:}
    bucket-name:     ${R2_BUCKET_NAME:irc}
    public-url-base: ${R2_PUBLIC_URL:}
    region:          ${R2_REGION:auto}


# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    # App-level logs at INFO by default for fast boot. Override per-package via
    # -Dlogging.level.ak.dev.irc=DEBUG when actually debugging.
    ak.dev.irc: ${APP_LOG_LEVEL:INFO}
    ak.dev.irc.security: INFO
    ak.dev.irc.irc_security.rabbitmq: INFO
    org.springframework.security: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    # Quiet retry-storm noise when RabbitMQ / Cassandra aren't running locally.
    # Set to INFO/DEBUG when actually debugging broker/driver issues.
    org.springframework.amqp.rabbit.listener: OFF
    org.springframework.amqp.rabbit.connection: OFF
    org.springframework.amqp: WARN
    org.springframework.data.cassandra: WARN
    com.datastax.oss.driver: ERROR
    # Quiet ES retry noise when Elasticsearch isn't running locally.
    org.springframework.data.elasticsearch: WARN
    co.elastic.clients: ERROR
    org.elasticsearch.client: ERROR
    # Silence the "Could not safely identify store assignment" INFO spam.
    # With JPA + Cassandra + Elasticsearch all on the classpath, Spring Data
    # runs strict mode and prints one INFO line for every repo each module
    # can't classify — ~480 lines on a project this size. The actual wiring
    # works (look for "Found N <store> repository interfaces"). WARN keeps
    # real configuration failures visible while killing the false-negative noise.
    org.springframework.data.repository.config: WARN
    org.hibernate.SQL: WARN
    org.hibernate: WARN
    io.netty: ERROR
    io.netty.util.internal: ERROR
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ═══════════════════════════════════════════════════════════════════════════════
#  SERVER
# ═══════════════════════════════════════════════════════════════════════════════
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

kind: Application
