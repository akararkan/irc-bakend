# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM — APPLICATION CONFIGURATION (UPDATED WITH CASSANDRA)
# ═══════════════════════════════════════════════════════════════════════════════

spring:

  application:
    name: irc

  # ── Boot speed knobs ────────────────────────────────────────────────────────
  # JMX off: skip MBean registration (~1s).
  # Banner off: cosmetic only.
  # NOTE: lazy-initialization is intentionally OFF — it makes the first request
  # to every controller slow (Spring builds the dependency graph on demand)
  # and can silently break @Scheduled jobs / SSE event publishers that need
  # to be eagerly instantiated. The bigger wins are ddl-auto=update and
  # schema-action=create_if_not_exists below.
  main:
    banner-mode: off
  jmx:
    enabled: false

  # DevTools auto-restart kills every open SSE connection on every recompile —
  # the browser then reconnects during the restart window and gets
  # NS_ERROR_CONNECTION_REFUSED. Keep DevTools loaded (LiveReload, dev props)
  # but disable the auto-restart so manual "Rerun" from IntelliJ is the only
  # thing that bounces the JVM. Set to true if you want hot-reload back.
  devtools:
    restart:
      enabled: ${DEVTOOLS_RESTART:false}
    livereload:
      enabled: true

  # ── Database: PostgreSQL (Primary Relational DB) ───────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/irc
    username: ${DB_USERNAME:khi}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA Configuration (PostgreSQL) ──────────────────────────────────────────────
  jpa:
    hibernate:
      # `update` keeps Postgres data across restarts — research, users, Q&A,
      # notifications all survive. Boot is dramatically faster because
      # Hibernate only emits incremental schema changes, not DROP + CREATE
      # for every entity. To force a wipe, run:
      #   psql -U khi -d irc -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
      # Or set the env var: JPA_DDL=create-drop
      ddl-auto: ${JPA_DDL:update}
    open-in-view: false
    # show-sql off in dev → meaningful boot-time savings on a chatty schema.
    # Toggle with -Dspring.jpa.show-sql=true when you actually want SQL logs.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 20
        query:
          in_clause_parameter_padding: true
        # Skip Hibernate's bytecode enhancer scan on entities Hibernate hasn't
        # explicitly enhanced — cheap dev-time saving.
        bytecode:
          provider: bytebuddy

  # ── SQL init disabled (no mock/seed data) ──────────────────────────────────────
  sql:
    init:
      mode: never

  # ── Cassandra Configuration (Time-Series & Events) ────────────────────────────
  cassandra:
    keyspace-name: ${CASSANDRA_KEYSPACE:irc_keyspace}
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
    username: ${CASSANDRA_USERNAME:cassandra}
    password: ${CASSANDRA_PASSWORD:cassandra}

    # Schema action: CREATE_IF_NOT_EXISTS, CREATE, RECREATE, RECREATE_DROP_UNUSED, NONE.
    # `create_if_not_exists` = fast path. Spring skips DDL for tables that
    # already exist (5-10s saved per boot). Cassandra data — posts, comments,
    # notifications, stories, counters — is preserved across restarts.
    # When you need a clean slate, drop the keyspace manually:
    #   cqlsh -e "DROP KEYSPACE irc_keyspace;"
    # Or set the env var: CASSANDRA_SCHEMA_ACTION=recreate_drop_unused
    schema-action: ${CASSANDRA_SCHEMA_ACTION:RECREATE_DROP_UNUSED}

    # Connection pool settings
    pool:
      heartbeat-interval: 30s
      idle-timeout: 5m
      max-queue-size: 256

    # Request settings
    request:
      # Bumped to 30s so the per-DDL schema-agreement round can complete
      # during RECREATE_DROP_UNUSED boots (each DROP/CREATE triggers a
      # cluster-wide schema-agreement protocol that can take 1–3s).
      timeout: 30s
      consistency: LOCAL_ONE

    # Control connection — drives DDL + schema agreement polling.
    # The defaults wait up to 10s per agreement; on a single-node dev
    # cluster the cluster IS in agreement immediately so we can poll
    # faster and bail out sooner. This shaves boot time during
    # RECREATE_DROP_UNUSED dramatically.
    controlconnection:
      schema-agreement:
        interval: 100ms       # default 200ms — poll twice as fast
        timeout:  2s          # default 10s — single-node never needs longer
        warn-on-failure: true

  # ── Elasticsearch (Search Engine: posts, users, hashtags) ─────────────────────
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 10s

  # ── Redis ──────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # ── OAuth2 Client ──────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ── RabbitMQ ───────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
    template:
      mandatory: true

  # ── Jackson ────────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    serialization:
      write-dates-as-timestamps: false

  # ── Mail (SMTP) ────────────────────────────────────────────────────────────────
  # Gmail / Google Workspace:
  #   1. Turn on 2-Step Verification on the sending Google account.
  #   2. Generate an "App password" — use that as MAIL_PASSWORD (not the login password).
  #   3. Set MAIL_USERNAME = <full email address>.
  # Custom SMTP: override MAIL_HOST / MAIL_PORT.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ika.center26@gmail.com}
    password: ${MAIL_PASSWORD:dbfrczyhfkxqylwn}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false

  # ── File Upload ────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # ── MVC ────────────────────────────────────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false


# ═══════════════════════════════════════════════════════════════════════════════
#  IRC PLATFORM CORE CONFIG
# ═══════════════════════════════════════════════════════════════════════════════
irc:
  doi:
    prefix: "10.12345"

  base-url: "https://irc.example.com"

  # Notification email branding + reply-to.
  email:
    # Resolves to ${MAIL_FROM} → ${spring.mail.username} (which itself defaults
    # to MAIL_USERNAME from the spring.mail block) → a no-reply placeholder.
    # Reading spring.mail.username here (instead of MAIL_USERNAME directly)
    # means the YAML default chain is honoured even when the env var is unset.
    from-address: ${MAIL_FROM:${spring.mail.username:no-reply@irc.example.com}}
    from-name: ${MAIL_FROM_NAME:IRC Platform}
    enabled: ${MAIL_ENABLED:true}
    # Throttle window — same (recipient, groupKey) won't be emailed twice
    # inside this duration. Mirrors the in-app aggregation window.
    throttle-minutes: ${MAIL_THROTTLE_MINUTES:60}

  verification:
    secret: ${IRC_VERIFICATION_SECRET:9fK2LmQ7xA4vZpR8sD1cYwN5TgH3UeB6}

  # Cassandra configuration (for events, audit logs, notifications)
  cassandra:
    enabled: ${CASSANDRA_ENABLED:true}
    max-batch-size: 1000
    async-enabled: true


