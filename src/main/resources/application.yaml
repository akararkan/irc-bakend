# ═══════════════════════════════════════════════════════════════════════════════
#  LOGGING
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    # App-level logs at INFO by default for fast boot. Override per-package via
    # -Dlogging.level.ak.dev.irc=DEBUG when actually debugging.
    ak.dev.irc: ${APP_LOG_LEVEL:INFO}
    ak.dev.irc.security: INFO
    ak.dev.irc.irc_security.rabbitmq: INFO
    org.springframework.security: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    # Quiet retry-storm noise when RabbitMQ / Cassandra aren't running locally.
    # Set to INFO/DEBUG when actually debugging broker/driver issues.
    org.springframework.amqp.rabbit.listener: OFF
    org.springframework.amqp.rabbit.connection: OFF
    org.springframework.amqp: WARN
    org.springframework.data.cassandra: WARN
    com.datastax.oss.driver: ERROR
    # Quiet ES retry noise when Elasticsearch isn't running locally.
    org.springframework.data.elasticsearch: WARN
    co.elastic.clients: ERROR
    org.elasticsearch.client: ERROR
    # Silence the "Could not safely identify store assignment" INFO spam.
    # With JPA + Cassandra + Elasticsearch all on the classpath, Spring Data
    # runs strict mode and prints one INFO line for every repo each module
    # can't classify — ~480 lines on a project this size. The actual wiring
    # works (look for "Found N <store> repository interfaces"). WARN keeps
    # real configuration failures visible while killing the false-negative noise.
    org.springframework.data.repository.config: WARN
    org.hibernate.SQL: WARN
    org.hibernate: WARN
    io.netty: ERROR
    io.netty.util.internal: ERROR
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


# ═══════════════════════════════════════════════════════════════════════════════
#  SERVER
# ═══════════════════════════════════════════════════════════════════════════════
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

kind: Application
